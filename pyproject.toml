[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastgrib"
version = "0.1.0"
description = "Fast GRIB2 decoding on the CPU and GPU, values bit-identical to wgrib2"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "numba>=0.57"]
keywords = ["grib", "grib2", "weather", "meteorology", "wgrib2", "gpu", "numba"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
xarray = ["xarray", "netCDF4"]
proj = ["pyproj"]
all = ["cupy-cuda12x", "xarray", "netCDF4", "pyproj"]
test = ["pytest"]

[project.scripts]
fastgrib = "fastgrib.__main__:main"

[tool.setuptools]
packages = ["fastgrib", "fastgrib.tables"]
license-files = ["LICENSE", "NOTICE", "LICENSE-ecCodes", "LICENSE-WMO-CCT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
