[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastgrib"
dynamic = ["version"]             # fastgrib.__version__, the one place it is written
description = "Fast GRIB2 decoding on the CPU and GPU, values bit-identical to wgrib2"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "numba>=0.57"]
keywords = ["grib", "grib2", "weather", "meteorology", "wgrib2", "gpu", "numba"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Homepage = "https://github.com/Rochy111/fastgrib"
Documentation = "https://github.com/Rochy111/fastgrib#readme"
Changelog = "https://github.com/Rochy111/fastgrib/blob/main/CHANGELOG.md"
Issues = "https://github.com/Rochy111/fastgrib/issues"

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
xarray = ["xarray", "netCDF4"]
proj = ["pyproj"]
all = ["cupy-cuda12x", "xarray", "netCDF4", "pyproj"]
test = ["pytest"]

[project.scripts]
fastgrib = "fastgrib.__main__:main"

[tool.setuptools]
packages = ["fastgrib", "fastgrib.tables"]
license-files = ["LICENSE", "NOTICE", "LICENSE-ecCodes", "LICENSE-WMO-CCT"]

[tool.setuptools.dynamic]
version = {attr = "fastgrib.__version__"}

[tool.setuptools.package-data]
fastgrib = ["_warm.grib2"]          # warm()'s sample: a field of every packing

[tool.pytest.ini_options]
testpaths = ["tests"]
