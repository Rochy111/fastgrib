[build-system]
# what it takes to build, and what fastgrib needs: setup.py compiles the decoders
requires = ["setuptools>=64", "setuptools-scm>=8", "numpy>=1.22", "numba>=0.57"]
build-backend = "setuptools.build_meta"

[project]
name = "fastgrib"
dynamic = ["version"]             # from git: the tag, or e.g. 0.2.2.dev3+g1a2b3c4 after it
description = "Fast GRIB2 decoding on the CPU and GPU, values bit-identical to wgrib2"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "numba>=0.57"]
keywords = ["grib", "grib2", "weather", "meteorology", "wgrib2", "gpu", "numba"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Homepage = "https://github.com/Rochy111/fastgrib"
Documentation = "https://github.com/Rochy111/fastgrib#readme"
Changelog = "https://github.com/Rochy111/fastgrib/blob/main/CHANGELOG.md"
Issues = "https://github.com/Rochy111/fastgrib/issues"

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
xarray = ["xarray", "netCDF4"]
proj = ["pyproj"]
all = ["cupy-cuda12x", "xarray", "netCDF4", "pyproj"]
test = ["pytest"]

[project.scripts]
fastgrib = "fastgrib.__main__:main"

[tool.setuptools]
packages = ["fastgrib", "fastgrib.tables"]
license-files = ["LICENSE", "NOTICE", "LICENSE-ecCodes", "LICENSE-WMO-CCT"]

[tool.setuptools_scm]
# every commit gets a higher version than the last, so pip install -U
# git+https://github.com/Rochy111/fastgrib upgrades an install
version_file = "fastgrib/_version.py"
fallback_version = "0+unknown"    # a copy of the source with no git history

[tool.setuptools.package-data]
fastgrib = ["_warm.grib2"]          # warm()'s sample: a field of every packing and grid

[tool.pytest.ini_options]
testpaths = ["tests"]
