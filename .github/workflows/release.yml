name: release

# A tag vX.Y.Z (the version, which setuptools-scm takes from it) builds and tests the package
# and makes the GitHub release, its wheel and sdist attached. PyPI only by
# hand (Actions > release > Run workflow: publish to testpypi or pypi), once
# its trusted publisher is set up (CONTRIBUTING.md); no token is stored.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish to'
        type: choice
        options: [nowhere, testpypi, pypi]
        default: nowhere

jobs:
  build:
    name: Build and test the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags too: the version comes from git

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: The wheel's version is the tag's
        if: github.ref_type == 'tag'
        run: |
          ls "dist/fastgrib-${GITHUB_REF_NAME#v}-py3-none-any.whl" || {
            echo "::error::tag $GITHUB_REF_NAME, but built $(ls dist)"; exit 1; }

      - name: Test the wheel as a user installs it
        # in a folder without the source, so what is imported is what is shipped
        run: |
          python -m pip install "$(ls dist/*.whl)[xarray,proj]" pytest
          mkdir -p ../wheeltest && cp -r tests tools ../wheeltest/
          cd ../wheeltest
          python -c "import fastgrib, os; assert 'site-packages' in fastgrib.__file__, fastgrib.__file__; print('testing', fastgrib.__version__, 'from', os.path.dirname(fastgrib.__file__))"
          fastgrib -warm
          python -m pytest -q -ra tests

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fastgrib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastgrib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "fastgrib $v" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
