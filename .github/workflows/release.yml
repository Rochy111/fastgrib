name: release

# A tag vX.Y.Z (matching fastgrib.__version__) builds, tests and publishes to
# PyPI, then makes the GitHub release. By hand (Actions > release > Run
# workflow): build and test only, or publish to TestPyPI or PyPI.
# Publishing uses PyPI's trusted publishing: no token is stored anywhere.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish to'
        type: choice
        options: [nowhere, testpypi, pypi]
        default: nowhere

jobs:
  build:
    name: Build and test the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The tag matches fastgrib.__version__
        if: github.ref_type == 'tag'
        run: |
          v=$(python -c "import ast; print([n.value.value for n in ast.parse(open('fastgrib/__init__.py').read()).body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'][0])")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but fastgrib.__version__ is $v"; exit 1
          fi

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Test the wheel as a user installs it
        # in a folder without the source, so what is imported is what is shipped
        run: |
          python -m pip install "$(ls dist/*.whl)[xarray,proj]" pytest
          mkdir -p ../wheeltest && cp -r tests tools ../wheeltest/
          cd ../wheeltest
          python -c "import fastgrib, os; assert 'site-packages' in fastgrib.__file__, fastgrib.__file__; print('testing', fastgrib.__version__, 'from', os.path.dirname(fastgrib.__file__))"
          fastgrib -warm
          python -m pytest -q -ra tests

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fastgrib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastgrib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "fastgrib $v" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
