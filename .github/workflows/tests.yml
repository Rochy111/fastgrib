name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Python fastgrib supports, and numpy 1 / numpy 2 on each platform
          - {os: ubuntu-latest, python: '3.9', numpy: 'numpy<2'}
          - {os: ubuntu-latest, python: '3.10', numpy: 'numpy>=2'}
          - {os: ubuntu-latest, python: '3.11', numpy: 'numpy<2'}
          - {os: ubuntu-latest, python: '3.12', numpy: 'numpy>=2'}
          - {os: ubuntu-latest, python: '3.13', numpy: 'numpy>=2'}
          - {os: windows-latest, python: '3.11', numpy: 'numpy<2'}
          - {os: windows-latest, python: '3.12', numpy: 'numpy>=2'}
          - {os: macos-latest, python: '3.12', numpy: 'numpy>=2'}    # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags too: the version comes from git

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.numpy }}" -e ".[xarray,proj,test]"

      - name: Versions
        run: python -c "import sys, platform, numpy, numba; print(sys.version, platform.machine()); print('numpy', numpy.__version__, '/ numba', numba.__version__)"

      - name: Tests
        run: python -m pytest -q -ra
